[package]
name = "production-mixer"
version = "1.0.0"
edition = "2021"
description = "Consola de mezcla de volúmenes por aplicación en tiempo real con interfaz Material 3 Expressive"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
tray-icon = "0.19"
png = "0.17"
base64 = "0.22"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
